<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000099">
  <title>EnBW-Speiseplan – aktuelle Woche für Stuttgart und weitere Standorte</title>
  <meta name="description" content="Aktueller EnBW-Speiseplan für Stuttgart, Karlsruhe und weitere Standorte. Menüs, vegetarische Gerichte und Beilagen von Montag bis Freitag.">
  <link rel="canonical" href="https://speiseplan.paul-maurer.de/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:title" content="EnBW-Speiseplan – aktuelle Woche">
  <meta property="og:description" content="Die Wochenkarte für Stuttgart, Karlsruhe und weitere EnBW-Standorte. Alle Gerichte von Montag bis Freitag im Überblick.">
  <meta property="og:url" content="https://speiseplan.paul-maurer.de/">
  <link rel="stylesheet" href="./speiseplan.css">
  <script src="./speiseplan.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>EnBW-Speiseplan</h1>
        <p id="week"></p>
      </div>
      <div class="location">
        <label for="location">Standort</label>
        <select id="location" disabled><option>Wird geladen …</option></select>
        <p id="location-details" hidden></p>
      </div>
    </header>
    <p class="week-note">Aus technischen Gründen kann nur der Speiseplan der aktuellen Woche von Montag bis Freitag angezeigt werden.</p>
    <p id="status" role="status">Der Speiseplan wird geladen …</p>
    <button id="retry" type="button" hidden>Erneut versuchen</button>
    <noscript>Bitte aktiviere JavaScript, um den Speiseplan anzuzeigen.</noscript>
    <div id="overview" class="table-scroll" role="region" aria-label="Speiseplan von Montag bis Freitag" tabindex="0" hidden>
      <table id="plan" aria-label="Menüs und Komponenten der Woche"></table>
    </div>
  </main>
</body>
</html>
